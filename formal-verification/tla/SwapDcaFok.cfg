\* Safety configuration: single-chunk-in-flight DCA (chunk_interval >= 2).
SPECIFICATION Spec

CONSTANTS
    TotalInput = 5
    NumChunks = 3
    TwoInFlight = FALSE
    MaxReschedules = 2
    AllowSameBlockFailures = FALSE

INVARIANTS
    TypeOK
    NoPanic
    InputConservation
    OutputConservation
    TerminalConservation
    DebugAssertHolds
    ActiveHasScheduled
    InFlightBound
    TerminalClean
