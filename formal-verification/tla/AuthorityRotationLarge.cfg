\* Larger safety configuration: 4 validators, both chains requiring handover.
SPECIFICATION Spec

CONSTANTS
    Validators = {v1, v2, v3, v4}
    Chains = {c1, c2}
    HandoverChains = {c1, c2}
    MinSize = 3
    MaxEpochs = 2
    MaxFailures = 3

SYMMETRY ValidatorPerms

INVARIANTS
    TypeOK
    NoViolation
    PhaseCoherence
    StatusSanity
    BannedNotCandidates
    AuthoritySetNeverTooSmall

PROPERTIES
    NoAbortAfterActivation
    AuthoritiesOnlyChangeAtEpochBoundary
    EpochOnlyAdvancesFromSessionRotating
