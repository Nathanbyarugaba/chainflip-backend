\* Safety configuration: two chunks in flight (chunk_interval == 1), with an
\* input that does not divide evenly and exceeds the chunk count.
SPECIFICATION Spec

CONSTANTS
    TotalInput = 7
    NumChunks = 4
    TwoInFlight = TRUE
    MaxReschedules = 2
    AllowSameBlockFailures = FALSE

INVARIANTS
    TypeOK
    NoPanic
    InputConservation
    OutputConservation
    TerminalConservation
    DebugAssertHolds
    ActiveHasScheduled
    InFlightBound
    TerminalClean
