\* Safety configuration. Terminal signing failure disabled: Standard signing
\* ceremonies retry forever and never resolve to Err (the enabled case is
\* checked separately in BroadcastLifecycleSigningFailure.cfg).
SPECIFICATION Spec

CONSTANTS
    Validators = {v1, v2, v3}
    MaxBroadcasts = 3
    RotationIds = {2}
    AllowSigningFailure = FALSE

INVARIANTS
    TypeOK
    AttemptHasTimeout
    FailedClearedOnResolution
    BarrierBacked

PROPERTIES
    AbortOnlyWhenAllFailed
    TerminalStability
