\* Finding configuration (EXPECTED TO FAIL - see REPORT.md "Findings").
\*
\* When chunk_interval == 1 two chunks of the same swap request can become due
\* in the same block and fail (e.g. a shared price-limit violation) after
\* their common refund_block. Both are removed from ScheduledSwaps for the
\* batch; the first refund cannot recover the sibling's amount (cancel_swap
\* finds nothing and log_or_panic!s), and the second refund finds the
\* SwapRequest already deleted and drops the chunk's input entirely.
\*
\* TLC is expected to report a violation of InputConservation in this config.
SPECIFICATION Spec

CONSTANTS
    TotalInput = 7
    NumChunks = 4
    TwoInFlight = TRUE
    MaxReschedules = 1
    AllowSameBlockFailures = TRUE

INVARIANTS
    TypeOK
    InputConservation
