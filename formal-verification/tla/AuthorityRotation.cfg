\* Safety configuration: exhaustive check of all invariants and action
\* properties. Symmetry on validator identities is sound here because no
\* liveness property is checked in this config.
SPECIFICATION Spec

CONSTANTS
    Validators = {v1, v2, v3}
    Chains = {c1, c2}
    HandoverChains = {c1}
    MinSize = 2
    MaxEpochs = 2
    MaxFailures = 2

SYMMETRY ValidatorPerms

INVARIANTS
    TypeOK
    NoViolation
    PhaseCoherence
    StatusSanity
    BannedNotCandidates
    AuthoritySetNeverTooSmall

PROPERTIES
    NoAbortAfterActivation
    AuthoritiesOnlyChangeAtEpochBoundary
    EpochOnlyAdvancesFromSessionRotating
