\* Observation/finding probe: after interest capitalisation, liquidation fee
\* can exceed the fee that would have been charged on the pre-collect owed.
\* We check that FeeGrew is reachable by asserting its negation.
SPECIFICATION Spec
CONSTANTS
    MaxPrincipal = 20
    MaxPending = 20
    MaxProvided = 30
    InterestRateBps = 5000
    LiqFeeBps = 1000
    NetworkFeePercent = 30
INVARIANT FeeNeverGrowsVsPreCollect
