\* Liveness configuration: checks that every started rotation terminates.
\* No symmetry reduction (unsound in combination with liveness checking);
\* uses a slightly smaller model to compensate.
SPECIFICATION FairSpec

CONSTANTS
    Validators = {v1, v2, v3}
    Chains = {c1, c2}
    HandoverChains = {c1}
    MinSize = 2
    MaxEpochs = 1
    MaxFailures = 1

INVARIANTS
    TypeOK
    NoViolation

PROPERTIES
    RotationTerminates
