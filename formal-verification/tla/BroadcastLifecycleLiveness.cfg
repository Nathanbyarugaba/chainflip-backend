\* Liveness configuration: every requested broadcast eventually succeeds or
\* aborts, even when validators fail arbitrarily, provided signing terminates
\* (AllowSigningFailure = FALSE, true for all Standard signing requests).
SPECIFICATION FairSpec

CONSTANTS
    Validators = {v1, v2}
    MaxBroadcasts = 2
    RotationIds = {1}
    AllowSigningFailure = FALSE

INVARIANTS
    TypeOK
    AttemptHasTimeout

PROPERTIES
    AllBroadcastsResolve
